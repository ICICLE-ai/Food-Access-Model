[project]
name = "food-access-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.11.11"
dependencies = [
    "fastapi==0.115.5",
    "mesa-geo==0.8.0",
    "osmnx==2.0.0",
    "psycopg2-binary==2.9.10",
    "gunicorn==22.0.0", # You can omit the version to always get the latest
    "pyinstrument==4.6.2",
    "databases>=0.9.0",
    "orjson>=3.11.0",
    "asyncpg>=0.30.0",
    "names-generator>=0.2.0",
    "python-dotenv>=1.1.1",
    "pyjwt[crypto]>=2.8.0", # #102: verify bearer tokens via JWKS instead of trusting them as-is
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "cryptography>=42.0", # for test_token_verification RSA keypair generation
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
